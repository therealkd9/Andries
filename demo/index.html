<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Live Demo · Andries</title>
<style>
  :root { --bg:#0c0e14; --frame:#1b1f2e; --gray:#26303f; --blue:#2f6df6; --text:#fff; --muted:#9aa3b8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:radial-gradient(900px 500px at 50% -10%,#161a2b,var(--bg) 60%); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:26px 16px 40px; }
  .lead { text-align:center; max-width:520px; margin-bottom:18px; }
  .lead h1 { font-size:20px; font-weight:700; }
  .lead h1 b { color:#6c8cff; }
  .lead p { color:var(--muted); font-size:14px; margin-top:6px; line-height:1.5; }

  .phone { width:330px; max-width:94vw; background:var(--frame); border:1px solid #2c3346; border-radius:34px;
    padding:12px 10px 16px; box-shadow:0 30px 80px rgba(0,0,0,.55); }
  .notch { width:120px; height:24px; background:#0c0e14; border-radius:0 0 16px 16px; margin:0 auto 8px; }
  .contact { text-align:center; padding:6px 0 12px; border-bottom:1px solid #2c3346; margin-bottom:10px; }
  .avatar { width:48px; height:48px; border-radius:50%; margin:0 auto 6px; display:flex; align-items:center;
    justify-content:center; font-weight:700; font-size:18px; background:linear-gradient(135deg,#4ade80,#2f6df6); color:#fff; }
  .contact .nm { font-size:15px; font-weight:600; }
  .contact .sub { font-size:11px; color:var(--muted); margin-top:2px; }

  .thread { min-height:430px; display:flex; flex-direction:column; gap:9px; padding:6px 6px 4px; }
  .sys { align-self:center; font-size:11px; color:var(--muted); background:#141826; padding:5px 12px; border-radius:999px; }
  .row { display:flex; max-width:82%; opacity:0; transform:translateY(8px); animation:pop .35s ease forwards; }
  .row.them { align-self:flex-start; }
  .row.me { align-self:flex-end; }
  .bub { padding:9px 13px; border-radius:18px; font-size:14px; line-height:1.4; }
  .them .bub { background:var(--gray); border-bottom-left-radius:5px; }
  .me .bub { background:var(--blue); border-bottom-right-radius:5px; }
  @keyframes pop { to { opacity:1; transform:none; } }

  .typing { align-self:flex-start; background:var(--gray); border-radius:18px; border-bottom-left-radius:5px;
    padding:11px 14px; display:none; }
  .typing.show { display:flex; gap:4px; }
  .typing span { width:7px; height:7px; background:#9aa3b8; border-radius:50%; animation:blink 1.2s infinite; }
  .typing span:nth-child(2){ animation-delay:.2s; } .typing span:nth-child(3){ animation-delay:.4s; }
  @keyframes blink { 0%,60%,100%{opacity:.3} 30%{opacity:1} }

  .money { max-width:440px; text-align:center; margin-top:18px; background:linear-gradient(180deg,#10241a,#0e1a14);
    border:1px solid #1f5138; border-radius:14px; padding:14px 18px; color:#cdebd9; font-size:14px; line-height:1.55;
    opacity:0; transition:opacity .6s; }
  .money.show { opacity:1; }
  .money b { color:#4ade80; }
  .cap { max-width:420px; text-align:center; margin-top:14px; color:var(--muted); font-size:13px; line-height:1.6; opacity:0; transition:opacity .6s; }
  .cap.show { opacity:1; }
  .cap b { color:#4ade80; }
  .btnrow { margin-top:14px; display:flex; gap:10px; opacity:0; transition:opacity .6s; }
  .btnrow.show { opacity:1; }
  .btn { background:#1b1f2e; border:1px solid #2c3346; color:#fff; border-radius:10px; padding:9px 16px; font-size:13px; cursor:pointer; }
  .btn.primary { background:#2f6df6; border-color:#2f6df6; }
</style>
</head>
<body>
  <div class="lead">
    <h1>What your customers get when <b id="leadName">your business</b> can't pick up</h1>
    <p>A real missed call → answered, qualified, and booked. Automatically. No one at the shop touched a thing.</p>
  </div>

  <div class="phone">
    <div class="notch"></div>
    <div class="contact">
      <div class="avatar" id="avatar">B</div>
      <div class="nm" id="contactName">Your Business</div>
      <div class="sub">Text Message · Today</div>
    </div>
    <div class="thread" id="thread">
      <div class="typing" id="typing"><span></span><span></span><span></span></div>
    </div>
  </div>

  <div class="money" id="money"></div>
  <div class="cap" id="cap"></div>
  <div class="btnrow" id="btnrow"><button class="btn primary" id="replay">▶ Replay</button></div>

<script>
(function(){
  var params = new URLSearchParams(location.search);
  var name = params.get("name") || "Your Business";
  var type = (params.get("type") || "generic").toLowerCase();

  var SCRIPTS = {
    hvac:      { problem:["ac just quit on me","house is already 85 in here 🥵"], reply:["Oh no, in this heat? Let's get you cooled down quick.","What's the address and a good number to reach you?"], book:"We've got someone who can be out today between 4 and 6. Want me to lock it in?" },
    plumbing:  { problem:["got water leaking under my kitchen sink","kinda a mess honestly"], reply:["Yikes, let's get that stopped before it spreads.","What's the address and best number to reach you?"], book:"I can have a plumber out there today between 3 and 5. Want me to book it?" },
    roofing:   { problem:["think i've got a roof leak","started after that storm last night"], reply:["Let's get eyes on it before it gets worse.","What's the address and a good number for you?"], book:"We can do a free inspection tomorrow morning. Want me to set it up?" },
    electrical:{ problem:["half my outlets just went dead","not sure what happened"], reply:["Let's get that sorted out safely.","What's the address and a good callback number?"], book:"An electrician can swing by today between 2 and 4. Want me to lock it in?" },
    landscaping:{ problem:["need a quote for my yard","it's gotten kinda out of control lol"], reply:["Ha, we got you. Happy to come take a look.","What's the address and best number for the estimate?"], book:"We can come by Thursday for a free quote. Want me to schedule it?" },
    garage:    { problem:["my garage door won't open","and my car's stuck inside 😩"], reply:["Let's get you back in.","What's the address and a good number to reach you?"], book:"A tech can be out today between 1 and 3. Want me to book it?" },
    pest:      { problem:["seeing roaches in the kitchen","need someone out soon"], reply:["Gross, let's take care of that fast.","What's the address and best callback number?"], book:"We can treat it first thing tomorrow. Want me to set it up?" },
    generic:   { problem:["hey, tried calling","need some help"], reply:["Happy to help!","What's going on, and what's a good number to reach you?"], book:"We can get someone out to you soon. Want me to book a time?" }
  };
  var MONEY = {
    hvac:"📈 One missed call can be a <b>$350 to $600</b> service job, and a few thousand on an install. Catch even a handful a week and that's <b>$4,000+ a month</b> you're leaving on the table right now.",
    plumbing:"📈 One missed call can be a <b>$250 to $700</b> job. Catch even a few a week and that's <b>$3,500+ a month</b> walking out the door right now.",
    roofing:"📈 One missed roofing lead can be an <b>$8,000+</b> job. Catching even one or two extra a month is <b>tens of thousands</b> you're not capturing right now.",
    electrical:"📈 One missed call can be a <b>$200 to $800</b> job. Catch even a few a week and that's <b>$3,000+ a month</b> you're leaving on the table.",
    landscaping:"📈 One missed quote can be a <b>$150 to $500</b> job, plus the recurring work behind it. That's easily <b>$2,500+ a month</b> slipping away.",
    garage:"📈 One missed call can be a <b>$200 to $600</b> job. Catch even a few a week and that's <b>$2,500+ a month</b> you're not capturing right now.",
    pest:"📈 One missed call can be a <b>$150 to $400</b> job, plus a recurring plan. That's <b>$2,500+ a month</b> in work walking away.",
    generic:"📈 One missed call can be a <b>$200 to $800</b> job. Catch even a few a week and that's <b>$3,000+ a month</b> you're leaving on the table right now."
  };
  var s = SCRIPTS[type] || SCRIPTS.generic;
  var money = MONEY[type] || MONEY.generic;
  var initials = name.replace(/[^A-Za-z ]/g,"").trim().split(/\s+/).map(function(w){return w[0];}).join("").slice(0,2).toUpperCase() || "B";

  document.getElementById("leadName").textContent = name;
  document.getElementById("contactName").textContent = name;
  document.getElementById("avatar").textContent = initials;
  document.title = "Live Demo · " + name;

  var steps = [
    { sys:"📞 Missed call from a new customer · 2:14 PM" },
    { who:"them", text:"Hey! This is "+name+" 👋" },
    { who:"them", text:"So sorry we missed your call, we're out on a job right now. What's going on?" }
  ];
  s.problem.forEach(function(t){ steps.push({ who:"me", text:t }); });
  s.reply.forEach(function(t){ steps.push({ who:"them", text:t }); });
  steps.push({ who:"me",   text:"123 oak st" });
  steps.push({ who:"me",   text:"337 555 0148" });
  steps.push({ who:"them", text:s.book });
  steps.push({ who:"me",   text:"yes please 🙏" });
  steps.push({ who:"them", text:"You're all set! 🎉 We'll send a confirmation and let you know when we're headed your way. Thanks for going with "+name+"." });

  var thread = document.getElementById("thread");
  var typing = document.getElementById("typing");

  function addRow(step){
    if (step.sys){ var d=document.createElement("div"); d.className="sys"; d.textContent=step.sys; thread.insertBefore(d, typing); return; }
    var row=document.createElement("div"); row.className="row "+step.who;
    var b=document.createElement("div"); b.className="bub"; b.textContent=step.text;
    row.appendChild(b); thread.insertBefore(row, typing);
  }

  var t=[];
  function clearAll(){ t.forEach(clearTimeout); t=[];
    Array.prototype.slice.call(thread.querySelectorAll(".row,.sys")).forEach(function(n){n.remove();});
    typing.classList.remove("show");
    document.getElementById("money").classList.remove("show");
    document.getElementById("cap").classList.remove("show");
    document.getElementById("btnrow").classList.remove("show");
  }

  function run(){
    clearAll();
    var delay=400;
    steps.forEach(function(step,i){
      if (step.who==="them"){
        t.push(setTimeout(function(){ typing.classList.add("show"); }, delay));
        delay += 900;
        t.push(setTimeout(function(){ typing.classList.remove("show"); addRow(step); }, delay));
        delay += 500;
      } else {
        t.push(setTimeout(function(){ addRow(step); }, delay));
        delay += 700;
      }
    });
    t.push(setTimeout(function(){
      var mn=document.getElementById("money");
      mn.innerHTML = money; mn.classList.add("show");
      var cap=document.getElementById("cap");
      cap.innerHTML = 'Every bit of that happened <b>automatically</b>. Answered in seconds, qualified, and booked, while the crew stayed on the job. <br>Built for <b>'+name+'</b> by Andries.';
      cap.classList.add("show");
      document.getElementById("btnrow").classList.add("show");
      window.__demoDone = true;
    }, delay+300));
  }

  document.getElementById("replay").addEventListener("click", run);
  run();
})();
</script>
</body>
</html>
